{% extends "base.html" %}

{% block content %}
<div class="two-col">
  <section class="panel"><div class="panel-head"><h2>负载</h2></div><pre class="terminal">{{ status.load }}</pre></section>
  <section class="panel"><div class="panel-head"><h2>内存</h2></div><pre class="terminal">{{ status.mem }}</pre></section>
  <section class="panel"><div class="panel-head"><h2>磁盘</h2></div><pre class="terminal">{{ status.disk }}</pre></section>
  <section class="panel"><div class="panel-head"><h2>Docker 状态</h2></div><pre class="terminal">{{ status.docker }}</pre></section>
</div>

<section class="panel">
  <div class="panel-head">
    <h2>审计日志</h2>
    <span>最近 100 条</span>
  </div>
  <table>
    <thead><tr><th>ID</th><th>动作</th><th>详情</th><th>创建时间</th></tr></thead>
    <tbody>
      {% for row in audit_rows %}
      <tr><td>{{ row.id }}</td><td>{{ row.action }}</td><td>{{ row.detail }}</td><td>{{ row.created_at }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
