{% macro stat(label, value, tone='') -%}
<article class="metric {{ tone }}">
  <span>{{ label }}</span>
  <strong>{{ value }}</strong>
</article>
{%- endmacro %}

{% macro top_table(title, rows) -%}
<div class="panel">
  <div class="panel-head">
    <h2>{{ title }}</h2>
  </div>
  {% if rows %}
  <table>
    <thead><tr><th>Object</th><th>Count</th></tr></thead>
    <tbody>
      {% for key, value in rows %}
      <tr><td><code>{{ key }}</code></td><td>{{ value }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
  <p class="empty">No data.</p>
  {% endif %}
</div>
{%- endmacro %}
